name: Unit Test Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of private repo to test'
        required: false
        default: 'main'
  repository_dispatch:
    types: [ build_from_private ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: AltafYafai/attendance-app
          ref: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Build Started Message
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🧪 Unit Test Build Started - Branch: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'main' }}%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        id: test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

      - name: Send Final Result
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            MSG="✅ Unit Tests Passed"
          else
            LOG=$(tail -40 test.log 2>/dev/null || echo "No log available")
            MSG="❌ Unit Tests Failed%0A${LOG}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="$MSG" -d disable_web_page_preview=true
