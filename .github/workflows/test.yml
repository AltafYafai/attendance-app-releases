name: Test Build

on:
  repository_dispatch:
    types: [ build_from_private ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: AltafYafai/attendance-app
          ref: ${{ github.event.client_payload.branch || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Notify build started
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "manual")
          HASH=$(git log -1 --pretty=format:"%h" 2>/dev/null || echo "N/A")
          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf "🔄 Build Started: %s@%s\nCommit: %s - %s\n%s" \
            "${{ github.repository }}" "${{ github.ref_name }}" "$HASH" "$MSG" "$URL")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="${TEXT}" -d disable_web_page_preview=true > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Notify environment ready
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          TEXT=$(printf "⚙️ Environment Ready\nJDK 17 + Gradle configured\n%s" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="${TEXT}" -d disable_web_page_preview=true > /dev/null

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            touch app/release.keystore
          fi

      - name: Notify keystore ready
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          TEXT=$(printf "🔑 Keystore Decoded\nRelease signing configured")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="${TEXT}" -d disable_web_page_preview=true > /dev/null



      - name: Notify build in progress
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          TEXT=$(printf "🔨 Building APK\nRunning ./gradlew assemble...")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="${TEXT}" -d disable_web_page_preview=true > /dev/null

      - name: Build APK
        id: build
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -s app/release.keystore ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            echo "built_type=release" >> $GITHUB_OUTPUT
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            exit $status
          else
            ./gradlew assembleDebug 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            echo "built_type=debug" >> $GITHUB_OUTPUT
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            exit $status
          fi

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-${{ steps.build.outputs.built_type }}
          path: ${{ steps.build.outputs.apk_path }}

      - name: Telegram final result
        if: always()
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APK_FILE="${{ steps.build.outputs.apk_path }}"
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -f "$APK_FILE" ]; then
            MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "manual")
            VERSION=$(grep "versionName =" app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            CAPTION=$(printf "✅ Test Build Succeeded (%s v%s): %s@%s\nCommit: %s\n%s" \
              "${{ steps.build.outputs.built_type }}" "$VERSION" "${{ github.repository }}" "${{ github.ref_name }}" "$MSG" "$URL")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document=@"$APK_FILE" \
              -F caption="${CAPTION}" > /dev/null
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "manual")
            TEXT=$(printf "✅ Test Build Succeeded (APK not found): %s@%s\nCommit: %s\n%s" \
              "${{ github.repository }}" "${{ github.ref_name }}" "$MSG" "$URL")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" -d text="${TEXT}" -d disable_web_page_preview=true > /dev/null
          else
            LOG=$(tail -30 build.log 2>/dev/null || echo "No log available")
            TEXT=$(printf "❌ Test Build Failed: %s@%s\n%s\n%s" \
              "${{ github.repository }}" "${{ github.ref_name }}" "$LOG" "$URL")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="${TEXT}" > /dev/null
          fi
