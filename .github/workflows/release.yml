name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.0)'
        required: false
        type: string
  repository_dispatch:
    types: [build_from_private]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AltafYafai/attendance-app
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Send Build Started Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Release Build Started - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Send Final Result
        if: always()
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
            TAG="v${VERSION}"
            
            # Create GitHub Release via REST API
            GH_API="https://api.github.com/repos/AltafYafai/attendance-app-releases"
            curl -s -X POST \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\", \"body\": \"Release build from CI\"}" \
              "${GH_API}/releases" > /dev/null 2>&1 || true
            
            # Upload APK to release
            RELEASE_ID=$(curl -s -H "Authorization: token ${RELEASE_TOKEN}" \
              "${GH_API}/releases/tags/${TAG}" | grep -oP '"id":\s*\K[0-9]+' | head -1)
            
            if [ -n "${RELEASE_ID}" ]; then
              curl -s -X POST \
                -H "Authorization: token ${RELEASE_TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                -H "Content-Disposition: attachment; filename=attendance-app-${TAG}.apk" \
                --data-binary "@app/build/outputs/apk/release/app-release.apk" \
                "${GH_API}/releases/${RELEASE_ID}/assets?name=attendance-app-${TAG}.apk" > /dev/null 2>&1 || true
            fi
            
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Release Build Succeeded - ${TAG} (APK uploaded to GitHub Release)"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Release Build Failed"
          fi
