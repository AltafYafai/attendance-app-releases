name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.0)'
        required: false
        type: string
  repository_dispatch:
    types: [build_from_private]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ -n "${{ github.event.client_payload.branch }}" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: AltafYafai/attendance-app
          ref: ${{ steps.branch.outputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Send Build Started Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Release Build Started (${BRANCH}) - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Create GitHub Release
        if: steps.build.outcome == 'success'
        id: ghrelease
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          TAG="v${VERSION}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          GH_API="https://api.github.com/repos/AltafYafai/attendance-app-releases"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "GH_API=$GH_API" >> "$GITHUB_OUTPUT"
          
          # Try to create release
          RESP=$(curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"${TAG}\", \"body\": \"Release build from CI\"}" \
            "${GH_API}/releases")
          echo "CREATE_RESP: $RESP"
          
          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('id',0))" 2>/dev/null || echo "0")
          if [ "${RELEASE_ID}" = "0" ]; then
            # Release may already exist - get its id
            RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
              "${GH_API}/releases/tags/${TAG}" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('id',0))" 2>/dev/null || echo "0")
            echo "EXISTING_RELEASE_ID: $RELEASE_ID"
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          
          if [ "${RELEASE_ID}" != "0" ]; then
            UPLOAD_RESP=$(curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Disposition: attachment; filename=attendance-app-${TAG}.apk" \
              --data-binary "@${APK_PATH}" \
              "${GH_API}/releases/${RELEASE_ID}/assets?name=attendance-app-${TAG}.apk")
            echo "UPLOAD_RESP: $UPLOAD_RESP"
          fi

      - name: Send Final Result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            TAG="${{ steps.ghrelease.outputs.TAG }}"
            APK_PATH="${{ steps.ghrelease.outputs.APK_PATH }}"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document="@${APK_PATH}" \
              -F caption="Release Build Succeeded - ${TAG}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Release Build Failed"
          fi
