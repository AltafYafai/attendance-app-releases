name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.0)'
        required: false
        type: string
  repository_dispatch:
    types: [build_from_private]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ -n "${{ github.event.client_payload.branch }}" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=feature" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: AltafYafai/attendance-app
          ref: ${{ steps.branch.outputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Send Build Started Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Release Build Started (${BRANCH}) - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Create GitHub Release
        if: steps.build.outcome == 'success'
        id: ghrelease
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          TAG="v${VERSION}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          GH_API="https://api.github.com/repos/AltafYafai/attendance-app-releases"
          UPLOAD_API="https://uploads.github.com/repos/AltafYafai/attendance-app-releases"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

          # Baseline tag (private repo) for changelog
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -n1)
          fi
          export PREV_TAG

          # Generate changelog from the CHANGELOG.md entry for this version
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ.get("TAG", "")
          version = tag.lstrip("vV")
          body = ""
          if os.path.exists("CHANGELOG.md"):
              try:
                  text = open("CHANGELOG.md", encoding="utf-8").read()
                  pat = re.compile(r'^##\s*\[?' + re.escape(version) + r'\]?(?=\s|$)', re.MULTILINE)
                  m = pat.search(text)
                  if m:
                      after = text[m.end():]
                      nl = after.find("\n")
                      if nl != -1:
                          after = after[nl + 1:]
                      nxt = re.search(r'\n##\s', after)
                      end = nxt.start() if nxt else len(after)
                      body = after[:end].strip()
              except Exception:
                  body = ""
          # Fallback: build from commit messages if no CHANGELOG entry exists
          if not body:
              prev = os.environ.get("PREV_TAG", "")
              try:
                  out = subprocess.check_output(["git", "log", f"{prev}..HEAD", "--pretty=format:%s"], text=True).strip()
              except Exception:
                  out = ""
              items = [l for l in out.splitlines() if l.strip()]
              body = "\n".join(f"- {l}" for l in items) if items else "- Bug fixes and improvements"
          open("/tmp/body.txt", "w").write(body)
          PY

          # Create or update the release. Only a verified 404 may start a new release.
          set +e
          RELEASE_STATUS=$(curl --fail-with-body -sS -o /tmp/existing-release.json -w '%{http_code}' \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/releases/tags/${TAG}")
          RELEASE_CURL_STATUS=$?
          set -e
          if [ "$RELEASE_CURL_STATUS" -ne 0 ] && [ "$RELEASE_STATUS" != "404" ]; then
            echo "Unable to query release ${TAG} (HTTP ${RELEASE_STATUS})" >&2
            cat /tmp/existing-release.json >&2
            exit 1
          fi
          RELEASE_ID="0"
          if [ "$RELEASE_STATUS" = "200" ]; then
            RELEASE_ID=$(python3 -c "import json; print(json.load(open('/tmp/existing-release.json'))['id'])")
          fi
          RELEASE_PAYLOAD=$(python3 -c "import json; print(json.dumps({'tag_name': '$TAG', 'name': '$TAG', 'body': open('/tmp/body.txt').read()}))")
          if [ "${RELEASE_ID}" = "0" ]; then
            RESP=$(curl --fail-with-body -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$RELEASE_PAYLOAD" \
              "${GH_API}/releases")
            RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          else
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$RELEASE_PAYLOAD" \
              "${GH_API}/releases/${RELEASE_ID}" >/dev/null
          fi
          [ "${RELEASE_ID}" != "0" ] || { echo "Unable to create or locate release ${TAG}" >&2; exit 1; }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_OUTPUT"

          # Replace any same-name asset so rebuilds never report success while serving a stale APK.
          ASSET_NAME="attendance-app-${TAG}.apk"
          EXISTING_ASSET_ID=$(curl --fail-with-body -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/releases/${RELEASE_ID}/assets?per_page=100" | \
            python3 -c 'import sys,json; name=sys.argv[1]; asset=next((item for item in json.load(sys.stdin) if item["name"] == name), None); print(asset["id"] if asset else "")' "$ASSET_NAME")
          if [ -n "$EXISTING_ASSET_ID" ]; then
            curl --fail-with-body -sS -X DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GH_API}/releases/assets/${EXISTING_ASSET_ID}"
          fi
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Disposition: attachment; filename=${ASSET_NAME}" \
            --data-binary "@${APK_PATH}" \
            "${UPLOAD_API}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" >/dev/null
          echo "Uploaded ${ASSET_NAME} to release ${TAG}"

          # Tag private repo (best-effort) for future changelog baselines
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.email "ci@users.noreply.github.com"
            git config user.name "CI"
            git tag -a "$TAG" -m "$TAG"
            git push "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/AltafYafai/attendance-app.git" "$TAG" || echo "tag push skipped"
          fi

      - name: Send Final Result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.ghrelease.outcome }}" = "success" ]; then
            TAG="${{ steps.ghrelease.outputs.TAG }}"
            APK_PATH="${{ steps.ghrelease.outputs.APK_PATH }}"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document="@${APK_PATH}" \
              -F caption="Release Build Succeeded - ${TAG}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Release pipeline failed - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
