name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.5.0)'
        required: false
        type: string
  repository_dispatch:
    types: [build_from_private]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ -n "${{ github.event.client_payload.branch }}" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: AltafYafai/attendance-app
          ref: ${{ steps.branch.outputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Send Build Started Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Release Build Started (${BRANCH}) - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Create GitHub Release
        if: steps.build.outcome == 'success'
        id: ghrelease
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          TAG="v${VERSION}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          GH_API="https://api.github.com/repos/AltafYafai/attendance-app-releases"
          UPLOAD_API="https://uploads.github.com/repos/AltafYafai/attendance-app-releases"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"

          # Baseline tag (private repo) for changelog
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -n1)
          fi
          export PREV_TAG

          # Generate changelog from commit messages since previous tag
          python3 - <<'PY'
          import subprocess, os
          prev = os.environ.get("PREV_TAG", "")
          try:
              out = subprocess.check_output(["git", "log", f"{prev}..HEAD", "--pretty=format:%s|%h"], text=True).strip()
          except Exception:
              out = ""
          feats = []
          fixes = []
          other = []
          for line in out.splitlines():
              if not line.strip():
                  continue
              parts = line.split("|", 1)
              subj = parts[0]
              h = parts[1] if len(parts) > 1 else ""
              low = subj.lower()
              if low.startswith("feat"):
                  feats.append((subj, h))
              elif low.startswith("fix"):
                  fixes.append((subj, h))
              else:
                  other.append((subj, h))
          lines = ["## What's Changed"]
          if feats:
              lines.append("## Features")
              lines += [f"- {s} ({h})" for s, h in feats]
          if fixes:
              lines.append("## Fixes")
              lines += [f"- {s} ({h})" for s, h in fixes]
          if other:
              lines.append("## Other")
              lines += [f"- {s} ({h})" for s, h in other]
          if len(lines) == 1:
              lines.append("- Maintenance and improvements")
          open("/tmp/body.txt", "w").write("\n".join(lines))
          PY

          # Create release with generated body
          RESP=$(curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$(python3 -c "import json; print(json.dumps({'tag_name': '$TAG', 'name': '$TAG', 'body': open('/tmp/body.txt').read()}))")" \
            "${GH_API}/releases")
          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('id',0))" 2>/dev/null || echo "0")
          if [ "${RELEASE_ID}" = "0" ]; then
            RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${GH_API}/releases/tags/${TAG}" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('id',0))" 2>/dev/null || echo "0")
            if [ "${RELEASE_ID}" != "0" ]; then
              curl -s -X PATCH -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                -d "$(python3 -c "import json; print(json.dumps({'body': open('/tmp/body.txt').read()}))")" \
                "${GH_API}/releases/${RELEASE_ID}" >/dev/null
            fi
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_OUTPUT"

          if [ "${RELEASE_ID}" != "0" ]; then
            UPLOAD_RESP=$(curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Disposition: attachment; filename=attendance-app-${TAG}.apk" \
              --data-binary "@${APK_PATH}" \
              "${UPLOAD_API}/releases/${RELEASE_ID}/assets?name=attendance-app-${TAG}.apk")
            echo "UPLOAD_RESP: $UPLOAD_RESP"
          fi

          # Tag private repo (best-effort) for future changelog baselines
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.email "ci@users.noreply.github.com"
            git config user.name "CI"
            git tag -a "$TAG" -m "$TAG"
            git push "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/AltafYafai/attendance-app.git" "$TAG" || echo "tag push skipped"
          fi

      - name: Send Final Result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            TAG="${{ steps.ghrelease.outputs.TAG }}"
            APK_PATH="${{ steps.ghrelease.outputs.APK_PATH }}"
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document="@${APK_PATH}" \
              -F caption="Release Build Succeeded - ${TAG}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Release Build Failed"
          fi
